# Findings the vulnerability gate lets pass, each for a reason and until a
# date (docs/vuln-gate.md). An expired entry suppresses nothing: the
# finding fails the build again until it is fixed or the entry renewed.
#
# ignore:
#   - id: CVE-2024-12345          # the CVE (or the scanner's ID, e.g. GHSA-…)
#     reason: >-
#       Only reachable through the XML import, which simpleviz never calls;
#       upstream fix tracked in #123.
#     expires: 2026-12-31         # YYYY-MM-DD, valid through that day

ignore: []
