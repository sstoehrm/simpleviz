name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          # the newest babashka the CI matrix tests
          bb: '1.13.224'

      - name: Cache babashka deps
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: bb-deps-${{ hashFiles('bb.edn') }}

      - name: Run tests
        run: bb test

      - name: Build bundle
        run: bb bundle ${{ github.ref_name }}

      - name: Build and smoke-test the jar
        run: bb jar:smoke ${{ github.ref_name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/*.tar.gz dist/simpleviz.jar
          --title "simpleviz ${{ github.ref_name }}"
          --generate-notes
