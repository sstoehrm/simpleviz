name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest

      - name: Cache babashka deps
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: bb-deps-${{ hashFiles('bb.edn') }}

      - name: Run tests
        run: bb test
