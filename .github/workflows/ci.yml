name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the last two babashka minor releases; the floor is MIN_BB in install.sh
        bb: ['1.12.218', '1.13.224']
    name: test (bb ${{ matrix.bb }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: ${{ matrix.bb }}

      - name: Cache babashka deps
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: bb-deps-${{ hashFiles('bb.edn') }}

      - name: Run tests
        run: bb test

      - name: Smoke-test the release jar
        run: bb jar:smoke
