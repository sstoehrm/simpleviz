name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # the Clojure side only: squint's cljs in src/ uses forms clj-kondo
  # doesn't know (js-await, forward references); config in .clj-kondo/
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clj-kondo
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          clj-kondo: '2026.08.04'

      - name: Lint
        run: clj-kondo --lint server tools test bb.edn --fail-level error

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the last two babashka minor releases; the floor is MIN_BB in install.sh
        bb: ['1.12.218', '1.13.225']
    name: test (bb ${{ matrix.bb }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          bb: ${{ matrix.bb }}

      - name: Cache babashka deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: bb-deps-${{ hashFiles('bb.edn') }}

      - name: Run tests
        run: bb test

      - name: Smoke-test the release jar
        run: bb jar:smoke
