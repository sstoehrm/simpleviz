name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Two jobs, so the write token never meets project code: `build` runs the
# tests and builds (npm packages, Maven deps, Chrome, bb tasks) with a
# read-only token and restores no cache a main-branch run could have
# written; `publish` holds the release, OIDC and attestation permissions
# and runs nothing from the repository — it attests and publishes the
# files `build` handed over.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # the tag via env, never ${{ }} inside run: (script injection)
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          # the newest babashka the CI matrix tests
          bb: '1.13.226'
          # setup-clojure has no switch to turn its tool cache off; this
          # skips restoring it (it still saves one, scoped to this tag)
          invalidate-cache: 'true'

      - name: Plugin versions match the tag
        run: bb release:check "$TAG"

      # exactly package-lock.json, no install scripts (esbuild's only checks
      # the binary its @esbuild/<platform> package brings); bb build then
      # finds every locked version installed and installs nothing
      - name: Install npm packages
        run: npm ci --ignore-scripts

      - name: Run tests
        run: bb test

      - name: Build bundle
        run: bb bundle "$TAG"

      - name: Build and smoke-test the jar
        run: bb jar:smoke "$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/simpleviz.jar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # gh release create
      id-token: write     # Sigstore certificate for the attestation
      attestations: write # store the attestation
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # SLSA build provenance for what the release uploads; check one with
      # gh attestation verify <file> --repo sstoehrm/simpleviz \
      #   --signer-workflow sstoehrm/simpleviz/.github/workflows/release.yml
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/simpleviz.jar

      # no checkout here: GH_REPO names the repository
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$TAG"
          dist/*.tar.gz dist/simpleviz.jar
          --title "simpleviz $TAG"
          --generate-notes
