# The vulnerability gate, shared across repos: scans the SBOMs a caller's
# job uploaded (and, optionally, a container image it saved) with OSV-Scanner and
# fails only on what tools/vuln_gate.clj calls failing — CISA KEV, or EPSS
# >= 0.1 and CVSS >= 7.0 — minus current .vuln-ignore.yaml entries.
# docs/vuln-gate.md has the policy and the caller's side.
name: Vulnerability gate

on:
  workflow_call:
    inputs:
      sbom-artifact:
        description: Artifact holding the CycloneDX JSON SBOMs (*.cdx.json) to scan
        type: string
        default: sbom
      image-artifact:
        description: Artifact holding container images saved with `docker save` (*.tar); empty skips the image scan
        type: string
        default: ''
      allowlist:
        description: Allowlist file in the caller's repo
        type: string
        default: .vuln-ignore.yaml
      epss-min:
        type: number
        default: 0.1
      cvss-min:
        type: number
        default: 7.0

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # OSV-Scanner's release binary, checksum-pinned (from the release's
      # osv-scanner_SHA256SUMS). A bump edits both lines by hand; Renovate
      # won't.
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      # the caller's repo, for its allowlist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # this workflow's own repo at this workflow's commit, for the gate script
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .vuln-gate
          sparse-checkout: tools/vuln_gate.clj
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          bb: '1.13.226'

      - name: Install OSV-Scanner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/osv-scanner"
          bin="$RUNNER_TEMP/osv-scanner/osv-scanner"
          curl -fsSL -o "$bin" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $bin" | sha256sum --check --strict
          chmod +x "$bin"
          echo "$RUNNER_TEMP/osv-scanner" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.sbom-artifact }}
          path: ${{ runner.temp }}/sbom

      - if: inputs.image-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}/image

      # OSV-Scanner asks api.osv.dev at scan time, so there is no
      # vulnerability DB to cache. It exits 1 on findings, which the gate
      # decides on; anything but 0 or 1 (128: no packages in the SBOM) is
      # a broken scan and fails here.
      - name: Scan the SBOMs and images
        env:
          IMAGE_ARTIFACT: ${{ inputs.image-artifact }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mkdir -p vuln-gate-report
          scan() { # scan source|image <report> <args>
            local code=0
            if [ -e "$2" ]; then
              echo "::error::two scans would write $2"
              exit 1
            fi
            osv-scanner scan "$1" --verbosity error --format json --output-file "$2" "${@:3}" || code=$?
            if [ "$code" -gt 1 ]; then
              echo "::error::osv-scanner scan $* exited $code"
              exit "$code"
            fi
            if [ ! -s "$2" ]; then
              echo "::error::osv-scanner scan $* wrote no report"
              exit 1
            fi
          }
          # the report's name: the file's path in the artifact, % and / escaped
          # as %25 and %2F, so no two paths share a report
          report() { local rel="${2#"$3"/}"; rel="${rel//%/%25}"; echo "vuln-gate-report/$1-${rel//\//%2F}"; }
          sboms=("$RUNNER_TEMP"/sbom/**/*.cdx.json)
          if [ ${#sboms[@]} -eq 0 ]; then
            echo "::error::no *.cdx.json SBOM in the artifact"
            exit 1
          fi
          for sbom in "${sboms[@]}"; do
            scan source "$(report sbom "${sbom%.cdx.json}" "$RUNNER_TEMP/sbom").osv.json" -L "$sbom"
          done
          images=("$RUNNER_TEMP"/image/**/*.tar)
          if [ -n "$IMAGE_ARTIFACT" ] && [ ${#images[@]} -eq 0 ]; then
            echo "::error::no *.tar image in the artifact $IMAGE_ARTIFACT"
            exit 1
          fi
          for image in "${images[@]}"; do
            scan image "$(report image "${image%.tar}" "$RUNNER_TEMP/image").osv.json" --archive "$image"
          done

      # KEV and EPSS are fetched here, at job time; the gate fails closed
      # (exit 2) when either cannot be read
      - name: Gate
        working-directory: .vuln-gate
        env:
          ALLOWLIST: ${{ github.workspace }}/${{ inputs.allowlist }}
          EPSS_MIN: ${{ inputs.epss-min }}
          CVSS_MIN: ${{ inputs.cvss-min }}
          REPORT_DIR: ${{ github.workspace }}/vuln-gate-report
        run: |
          bb tools/vuln_gate.clj \
            --allowlist "$ALLOWLIST" --epss-min "$EPSS_MIN" --cvss-min "$CVSS_MIN" \
            --summary "$GITHUB_STEP_SUMMARY" --report "$REPORT_DIR/gate.json" \
            "$REPORT_DIR"/*.osv.json

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vuln-gate-report
          path: vuln-gate-report/
          if-no-files-found: ignore
          overwrite: true
