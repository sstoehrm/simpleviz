name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          # the newest babashka the CI matrix tests
          bb: '1.13.225'

      - name: Cache babashka deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: bb-deps-${{ hashFiles('bb.edn') }}

      - name: Plugin versions match the tag
        run: bb release:check ${{ github.ref_name }}

      - name: Run tests
        run: bb test

      - name: Build bundle
        run: bb bundle ${{ github.ref_name }}

      - name: Build and smoke-test the jar
        run: bb jar:smoke ${{ github.ref_name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/*.tar.gz dist/simpleviz.jar
          --title "simpleviz ${{ github.ref_name }}"
          --generate-notes
